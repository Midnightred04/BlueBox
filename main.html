<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blue Box - Main</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">

  <style>
   :root {
  --background: #121212;
  --box-bg: #1e1e1e;
  --border-color: #2a2a2a;
  --headline: #4dabf7;
  --text: #e0e0e0;
  --meta-text: #aaaaaa;
  --button-bg: #333;
  --button-hover: #555;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Georgia', serif;
  background: var(--background);
  color: var(--text);
}

.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 30px;
  border-bottom: 1px solid var(--border-color);
}

.header-bar h1 {
  margin: 0;
  font-size: 2.5rem;
  font-weight: 700;
  color: var(--headline);
}

.logout-button {
  padding: 10px 18px;
  font-size: 0.95rem;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  background: var(--button-bg);
  color: var(--text);
  cursor: pointer;
  transition: background 0.2s ease;
}

.logout-button:hover {
  background: var(--button-hover);
}


.container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 30px;
  padding: 20px;
}

.box {
  background: var(--box-bg);
  border: 1px solid var(--border-color);
  padding: 20px;
  border-radius: 6px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
  flex: 1 1 400px;
  max-width: 500px;
  height: 80vh;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.box h2 {
  font-family: 'Georgia', serif;
  font-size: 1.8rem;
  text-align: center;
  margin-bottom: 20px;
  color: var(--headline);
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 8px;
}

.entry {
  margin-bottom: 20px;
  padding: 15px;
  border-bottom: 1px solid var(--border-color);
}

.entry strong {
  display: block;
  font-family: 'Georgia', serif;
  font-weight: 700;
  font-size: 1.2rem;
  color: var(--text);
}

.entry p {
  margin: 8px 0 0;
  color: var(--text);
  text-align: justify;
  text-justify: inter-word;
}

.entry small {
  color: var(--meta-text);
  font-style: italic;
}

.entry button {
  background: #aa3333;
  color: white;
  border: none;
  border-radius: 4px;
  padding: 8px 12px;
  margin-top: 10px;
  cursor: pointer;
  font-size: 0.85rem;
  transition: background 0.2s ease;
}

.entry button:hover {
  background: #922222;
}

.add-button {
  margin-top: auto;
  padding: 12px;
  font-size: 1rem;
  border: none;
  border-radius: 6px;
  background: var(--button-bg);
  color: white;
  cursor: pointer;
  transition: background 0.2s ease;
}

.add-button:hover {
  background: var(--button-hover);
}

.modal-bg {
  position: fixed;
  top: 0;
  left: 0;
  height: 100%;
  width: 100%;
  background: rgba(0, 0, 0, 0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

.modal {
  background: var(--box-bg);
  padding: 30px;
  border-radius: 8px;
  width: 320px;
  display: flex;
  flex-direction: column;
}

.modal input,
.modal textarea {
  padding: 14px;
  border-radius: 4px;
  border: 1px solid var(--border-color);
  background: #2a2a2a;
  color: var(--text);
  margin-bottom: 12px;
  font-size: 1rem;
}

.modal-buttons {
  display: flex;
  gap: 12px;
  margin-top: 10px;
}

.modal-button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 4px;
  font-size: 1rem;
  cursor: pointer;
  transition: background 0.3s ease;
  color: white;
}

.modal-button.add {
  background: var(--button-bg);
}

.modal-button.add:hover {
  background: var(--button-hover);
}

.modal-button.cancel {
  background: #6e6e6e;
}

.modal-button.cancel:hover {
  background: #555;
}

.box {
  scrollbar-width: thin;
  scrollbar-color: var(--border-color) transparent;
}

.box::-webkit-scrollbar {
  width: 8px;
}

.box::-webkit-scrollbar-thumb {
  background: var(--border-color);
  border-radius: 4px;
}

    .load-status{color:var(--meta-text);margin:12px 0;text-align:center;font-size:.92rem}
    .load-status.error{color:#ff9898}
  </style>

</head>
<body>

  <div class="header-bar">
  <h1>Blue Box</h1>
  <button class="logout-button" onclick="logout()">Logout</button>
</div>

  <div class="container">
    <div class="box" id="gossip-box">
      <h2>Gossip</h2>
      <button class="add-button" onclick="openModal('gossip')">Add New</button>
    </div>
    <div class="box" id="plans-box">
      <h2>Plans</h2>
      <button class="add-button" onclick="openModal('plans')">Add New</button>
    </div>
  </div>

  <div class="modal-bg" id="modal-bg">
    <div class="modal">
  <input type="text" id="entry-title" placeholder="Title" />
  <textarea id="entry-desc" placeholder="Description" rows="4"></textarea>
  <div class="modal-buttons">
  <button class="modal-button add" onclick="addEntry()">Add</button>
  <button class="modal-button cancel" onclick="cancelEntry()">Cancel</button>
</div>

</div>

  </div>

  <!-- Firebase + Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getFirestore, collection, addDoc, getDocs, deleteDoc,
      doc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCd-bOBCPclL-A2GWPosoSX-MOMTtQFi5M",
      authDomain: "black-box-44047.firebaseapp.com",
      projectId: "black-box-44047",
      storageBucket: "black-box-44047.firebasestorage.app",
      messagingSenderId: "1007734936886",
      appId: "1:1007734936886:web:696655ce5befea36120f97"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentType = '';

    window.openModal = function (type) {
      currentType = type;
      document.getElementById('modal-bg').style.display = 'flex';
    };

    window.addEntry = async function () {
      const title = document.getElementById('entry-title').value.trim();
      const desc = document.getElementById('entry-desc').value.trim();
      if (!title || !desc) {
        alert("Please fill out both fields.");
        return;
      }

      try { await addDoc(collection(db, currentType), {
        title,
        desc,
        timestamp: serverTimestamp()
      });

      document.getElementById('entry-title').value = '';
      document.getElementById('entry-desc').value = '';
      document.getElementById('modal-bg').style.display = 'none';
      refreshSection(currentType);
      } catch(error) {
        console.error('Unable to add entry:', error);
        alert(error.code === 'permission-denied' ? 'Firebase permission denied. Check Firestore rules.' : 'Could not save entry: ' + (error.code || error.message));
      }
    };

    window.deleteEntry = async function (type, id) {
      if (confirm("Are you sure you want to delete this?")) {
        try {
          await deleteDoc(doc(db, type, id));
          refreshSection(type);
        } catch(error) {
          console.error('Unable to delete entry:', error);
          alert(error.code === 'permission-denied' ? 'Firebase permission denied. Check Firestore rules.' : 'Could not delete entry: ' + (error.code || error.message));
        }
      }
    };

    async function refreshSection(type) {
      const box = document.getElementById(type + '-box');
      const heading = document.createElement('h2');
      heading.textContent = type === 'gossip' ? 'Gossip' : 'Plans';
      const addButton = document.createElement('button');
      addButton.className = 'add-button';
      addButton.textContent = 'Add New';
      addButton.addEventListener('click', () => openModal(type));
      const status = document.createElement('p');
      status.className = 'load-status';
      status.textContent = 'Loading entries…';
      box.replaceChildren(heading, status, addButton);

      try {
        // A Firestore orderBy query excludes older entries missing the timestamp field.
        const snapshot = await getDocs(collection(db, type));
        const entries = snapshot.docs.slice().sort((a, b) =>
          (b.data().timestamp?.toMillis?.() ?? 0) - (a.data().timestamp?.toMillis?.() ?? 0));
        status.remove();
        for (const entry of entries) {
          const data = entry.data();
          const article = document.createElement('div');
          article.className = 'entry';
          const title = document.createElement('strong');
          title.textContent = data.title || 'Untitled';
          const description = document.createElement('p');
          if (type === 'gossip') description.className = 'gossip-desc';
          description.textContent = data.desc || '';
          const deleteButton = document.createElement('button');
          deleteButton.textContent = 'Delete';
          deleteButton.addEventListener('click', () => deleteEntry(type, entry.id));
          article.append(title, description, deleteButton);
          box.insertBefore(article, addButton);
        }
        if (!entries.length) {
          status.textContent = 'No entries found in this collection.';
          box.insertBefore(status, addButton);
        }
      } catch (error) {
        console.error('Blue Box failed to load ' + type + ':', error);
        status.classList.add('error');
        status.textContent = error.code === 'permission-denied'
          ? 'Firebase permission denied. Check Firestore Database → Rules for black-box-44047.'
          : 'Unable to load entries (' + (error.code || 'unknown error') + '). Check the browser console.';
      }
    }


    window.logout = function () { window.location.href = 'index.html'; };
    window.cancelEntry = function () {
      document.getElementById('entry-title').value = '';
      document.getElementById('entry-desc').value = '';
      document.getElementById('modal-bg').style.display = 'none';
    };

  // ✅ Service Worker Registration
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js')
      .then(registration => console.log('Service Worker registered:', registration))
      .catch(error => console.log('Service Worker registration failed:', error));
  }



    refreshSection('gossip');
    refreshSection('plans');

  </script>
</body>
</html>
