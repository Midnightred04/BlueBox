<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blue Box</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">

  <style>
    :root {
      --blue-1: #0d1b2a;
      --blue-2: #1b263b;
      --blue-3: #415a77;
      --blue-4: #778da9;
      --accent: #00bfff;
      --text-light: #f1f5f9;
      --shadow: rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      font-family: 'Inter', sans-serif;
      background-color: var(--blue-1);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 2.8rem;
      color: var(--accent);
      margin-bottom: 30px;
      text-align: center;
    }

    .login-box {
      background-color: var(--blue-2);
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 6px 20px var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90%;
      max-width: 400px;
    }

    input[type="password"],input[type="email"] {
      padding: 12px 16px;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      background-color: var(--blue-3);
      color: white;
      width: 100%;
      margin-bottom: 20px;
    }
    
        button {
      padding: 12px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      background-color: var(--accent);
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
      width: 100%;
    }

    button:hover {
      background-color: #3ac7ff; /* Lighter shade of --accent */
    }


  </style>
</head>
<body>
  <h1>Blue Box</h1>
  <form class="login-box" id="login-form">
    <input type="email" id="email" placeholder="Firebase account email" autocomplete="username" required>
    <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
    <button id="login-button" type="submit">Enter</button>
    <p id="login-error" role="alert" aria-live="polite" style="color:#ffb3b3;font-size:.9rem;line-height:1.5" hidden></p>
  </form>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { firebaseConfig } from "./firebase-config.js";
    const auth = getAuth(initializeApp(firebaseConfig));
    const form = document.getElementById('login-form');
    const message = document.getElementById('login-error');
    const button = document.getElementById('login-button');
    const params = new URLSearchParams(location.search);
    if (params.has('loggedout')) {
      message.textContent = 'You have been signed out.';
      message.hidden = false;
    } else {
      onAuthStateChanged(auth, user => {
        if (user) location.replace('./main.html');
      });
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      button.disabled = true;
      message.hidden = true;
      try {
        await setPersistence(auth, browserLocalPersistence);
        await signInWithEmailAndPassword(auth, document.getElementById('email').value.trim(), document.getElementById('password').value);
        location.replace('./main.html');
      } catch(error) {
        message.textContent = 'Unable to sign in. Check your Firebase account credentials and whether Email/Password sign-in is enabled.';
        message.hidden = false;
        console.error('BlueBox Firebase sign-in failed:', error.code || error);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
